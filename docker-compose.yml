services:

  postgres:
    image: postgres:15
    container_name: maras-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: canicas123
      POSTGRES_DB: detecciones
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d detecciones"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: maras-api
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=detecciones
      - DB_USER=admin
      - DB_PASS=canicas123
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - interna
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  streamlit:
    build: .
    container_name: maras-app
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=detecciones
      - DB_USER=admin
      - DB_PASS=canicas123
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - interna

  nginx:
    image: nginx:alpine
    container_name: maras-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - streamlit
    restart: unless-stopped
    networks:
      - interna

networks:
  interna:
    driver: bridge

volumes:
  postgres_data: