version: "3.9"

services:

  # ── FastAPI — API de inferencia ──────────────────────────────────────────
  api:
    build: .
    container_name: maras-api
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Streamlit — App web ──────────────────────────────────────────────────
  streamlit:
    build: .
    container_name: maras-app
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - api
    restart: unless-stopped

  # ── PostgreSQL — Base de datos ───────────────────────────────────────────
  services:
  app:
    build: .
    ports:
      - "8000:8000"
      - "8501:8501"
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: canicas123
      POSTGRES_DB: detecciones
    ports:
      - "5432:5432"

  # ── n8n — Automatización de flujos ──────────────────────────────────────
  n8n:
    image: n8nio/n8n
    container_name: maras-n8n
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - WEBHOOK_URL=https://deteccion-maras-canicas.duckdns.org/n8n/
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data: